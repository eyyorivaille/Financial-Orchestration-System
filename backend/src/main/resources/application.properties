spring.application.name=project

# MySQL (docker-compose: mysql, host port 3307 -> avoids conflict with a local MySQL on 3306)
spring.datasource.url=jdbc:mysql://localhost:3307/payment_platform
spring.datasource.username=app
spring.datasource.password=app

# Flyway manages the schema; Hibernate only validates entities against it
spring.jpa.hibernate.ddl-auto=validate

# This is a REST API, not a server-rendered view - keeping a transaction/connection
# open through view rendering has no benefit here, only the downside (connection
# held longer than needed). No entity in this codebase has a lazy association
# anyway, so there's nothing for open-in-view to have been papering over.
spring.jpa.open-in-view=false

# Kafka (docker-compose: kafka)
spring.kafka.bootstrap-servers=localhost:9092

# Kafka consumer (shared by every payment-events consumer: notification, audit, ...)
# - reads payment-events as raw strings; the shared paymentEventsKafkaListenerContainerFactory's
# Jackson message converter does the JSON -> POJO conversion (using the __TypeId__
# header), not the raw value deserializer - deserializing to a POJO at both layers
# throws "Only String, Bytes, or byte[] supported". Each @KafkaListener sets its
# own groupId, overriding this default, so every consumer gets every event.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.financial.project.payment

# OAuth2 Resource Server (docker-compose: keycloak, admin console at http://localhost:8081)
# Realm "payment-platform" + client "payment-platform-frontend" imported from keycloak/realm-export.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/payment-platform

# Resilience4j - fake payment provider circuit breaker (payment module)
resilience4j.circuitbreaker.instances.paymentProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentProvider.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentProvider.permitted-number-of-calls-in-half-open-state=3

# Risk rule engine (risk module) - all thresholds/scores configurable
risk.rules.amount.review-threshold-minor-units=1000000
risk.rules.amount.reject-threshold-minor-units=10000000
risk.rules.amount.review-score=30
risk.rules.amount.reject-score=80
risk.rules.country.blocked=
risk.rules.country.score=50
risk.rules.velocity.window-minutes=5
risk.rules.velocity.max-count=8
risk.rules.velocity.score=40
risk.outcome.review-score-threshold=30
risk.outcome.reject-score-threshold=70

# Resilience4j - fake core banking (SOAP) circuit breaker (settlement module)
resilience4j.circuitbreaker.instances.coreBanking.sliding-window-size=10
resilience4j.circuitbreaker.instances.coreBanking.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreBanking.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.coreBanking.permitted-number-of-calls-in-half-open-state=3

# Settlement's SOAP client calls the fake core-banking endpoint exposed by this
# same app (shared.WebServiceConfig) at /ws - simulating an external call.
settlement.core-banking.endpoint-uri=http://localhost:8080/ws
