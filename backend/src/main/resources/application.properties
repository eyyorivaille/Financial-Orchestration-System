spring.application.name=project

# MySQL (docker-compose: mysql, host port 3307 -> avoids conflict with a local MySQL on 3306)
spring.datasource.url=jdbc:mysql://localhost:3307/payment_platform
spring.datasource.username=app
spring.datasource.password=app

# Flyway manages the schema; Hibernate only validates entities against it
spring.jpa.hibernate.ddl-auto=validate

# Kafka (docker-compose: kafka)
spring.kafka.bootstrap-servers=localhost:9092

# OAuth2 Resource Server (docker-compose: keycloak, admin console at http://localhost:8081)
# Realm/client not created yet - enable once the "payment-platform" realm exists.
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/payment-platform
