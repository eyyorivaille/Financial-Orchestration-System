# src/test/resources/application.properties REPLACES src/main's entirely
# (Spring Boot loads only one application.properties from the classpath, and
# test-classes precedes classes in the test classpath) - it is NOT merged.
# Anything main's file sets that tests actually rely on must be repeated here.

# Tests must not depend on a live Keycloak: use a static (unreachable) jwk-set-uri
# instead of issuer-uri, which Spring Boot would otherwise eagerly fetch
# (.well-known/openid-configuration) at context startup. Tests that need an
# authenticated request use SecurityMockMvcRequestPostProcessors.jwt(), which
# bypasses real token decoding entirely, so this URI is never actually called.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/protocol/openid-connect/certs

# Running many @SpringBootTest/Testcontainers classes in one Surefire fork can
# briefly overlap context startup/teardown; the default pool (10 connections,
# 30s timeout) occasionally starves under that load, failing requests with
# CannotCreateTransactionException. Test-only headroom, not a production concern.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=60000

# Kafka consumer (shared by every payment-events consumer) - kept in sync with
# src/main/resources/application.properties.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.financial.project.payment

# Risk rule engine (risk module) - kept in sync with src/main/resources/application.properties.
# Rules use required @Value (no inline defaults) so these must be present.
risk.rules.amount.review-threshold-minor-units=1000000
risk.rules.amount.reject-threshold-minor-units=10000000
risk.rules.amount.review-score=30
risk.rules.amount.reject-score=80
risk.rules.country.blocked=
risk.rules.country.score=50
risk.rules.velocity.window-minutes=5
risk.rules.velocity.max-count=8
risk.rules.velocity.score=40
risk.outcome.review-score-threshold=30
risk.outcome.reject-score-threshold=70
